# Ukraine Conflict Lakehouse — source configuration
# Edit dates/box here; keep secrets in .env

region:
  name: Ukraine
  # bounding box: west, south, east, north (used by FIRMS area API)
  bbox: [22.0, 44.0, 40.5, 52.5]

acled:
  base_url: "https://acleddata.com/api/acled/read"
  oauth_url: "https://acleddata.com/oauth/token"
  countries: ["Ukraine"]        # add "Russia" if you want cross-border events
  start_date: "2022-02-24"       # full-scale invasion onward; widen if you like
  page_limit: 5000               # rows per page

boundaries:
  # HDX geoBoundaries Ukraine ADM1 (oblast) polygons — reference data, committed
  adm1_path: "config/boundaries/geoBoundaries-UKR-ADM1.geojson"

firms:
  base_url: "https://firms.modaps.eosdis.nasa.gov/api/area/csv"
  # sensors to pull; VIIRS gives the best spatial resolution for this use
  sources: ["VIIRS_SNPP_NRT", "VIIRS_NOAA20_NRT"]
  day_range: 1                   # NRT: 1 = most recent day (max 10 per call)
